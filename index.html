<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>One Page Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>One Page Report</h1>
  <p class="subtitle">Borang laporan satu muka surat</p>

  <!-- PILIHAN LAPORAN -->
  <div class="card">
    <label><strong>Pilihan Laporan</strong></label>
    <select id="pilihanLaporan">
      <option value="Program">Program</option>
      <option value="Aktiviti">Aktiviti</option>
      <option value="PLC">PLC</option>
    </select>

    <label><strong>Nama Program / Aktiviti / PLC</strong></label>
    <input type="text" id="namaLaporan">
  </div>

  <!-- TAHAP -->
  <div class="card">
    <label><strong>Pilihan Tahap</strong></label>
    <select id="pilihanTahap">
      <option value="Peringkat">Peringkat</option>
      <option value="Perjumpaan">Perjumpaan</option>
    </select>

    <label><strong>Tahap</strong></label>
    <input type="text" id="tahapText">
  </div>

  <!-- TARIKH & TEMPAT -->
  <div class="card grid-2">
    <div>
      <label><strong>Tarikh & Masa</strong></label>
      <input type="text" id="tarikhMasa">
    </div>
    <div>
      <label><strong>Tempat / Lokasi</strong></label>
      <input type="text" id="tempatLokasi">
    </div>
  </div>

  <!-- KEHADIRAN -->
  <div class="card">
    <label><strong>Jenis Kehadiran</strong></label>
    <select id="jenisKehadiran">
      <option value="Peserta">Peserta</option>
      <option value="Kumpulan Sasaran">Kumpulan Sasaran</option>
      <option value="Kehadiran">Kehadiran</option>
    </select>

    <label><strong>Jumlah Kehadiran</strong></label>
    <input type="text" id="jumlahKehadiran">
  </div>

  <!-- GURU -->
  <div class="card">
    <label><strong>Pilihan Guru</strong></label>
    <select id="pilihanGuru">
      <option value="Guru Penasihat">Guru Penasihat</option>
      <option value="Guru Pengiring">Guru Pengiring</option>
      <option value="Guru Penyelaras">Guru Penyelaras</option>
    </select>

    <label><strong>Nama Guru</strong></label>
    <textarea id="namaGuru"></textarea>
  </div>

  <!-- RUMUSAN -->
  <div class="card">
    <label><strong>Laporan</strong></label>
    <textarea id="laporan"></textarea>
  </div>

  <div class="card">
    <label><strong>Kekuatan</strong></label>
    <textarea id="kekuatan"></textarea>
  </div>

  <div class="card">
    <label><strong>Kelemahan</strong></label>
    <textarea id="kelemahan"></textarea>
  </div>

  <div class="card">
    <label><strong>Penambahbaikan</strong></label>
    <textarea id="penambahbaikan"></textarea>
  </div>

  <!-- DISEDIAKAN OLEH -->
  <div class="card">
    <label><strong>Disediakan Oleh</strong></label>
    <input type="text" id="disediakanOleh">
  </div>

  <!-- LAMPIRAN -->
  <div class="card">
    <label><strong>Lampiran Gambar (Max 4)</strong></label>
    <input type="file" id="imageInput" accept="image/png,image/jpeg" multiple>
  </div>
</div>

<div class="sticky-bar">
  <button id="generateBtn">Generate PDF</button>
</div>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="script.js"></script>
</body>
</html>
