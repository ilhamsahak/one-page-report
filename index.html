<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <title>OPR SMK Panglima Bukit Gantang 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <!-- HEADER WITH LOGO -->
  <header class="header">
    <div class="header-left">
      <img
        src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiNcU9iHuz9CVnYDbZRaTn2bH4VChkbRJYYMfjsiXaGGtB9s7dEwvZSqsupkoRlEmQS__XbXRL_fg_4VmVOYkoiCNz6m6Fb5SSzcbN23MSo1AYJL9LImDQSF8mL7RXFXVi-cBY4h2jnPIg/s1600/Logo+Sekolah+copy.png"
        alt="Logo Sekolah"
        class="school-logo"
      />
      <div>
        <h1>OPR Sekolah Menengah Kebangsaan Panglima Bukit Gantang 2026</h1>
        <p>One Page Report (OPR)</p>
      </div>
    </div>
  </header>

  <!-- PILIHAN LAPORAN -->
  <div class="card">
    <label>Pilihan Laporan</label>
    <select id="pilihanLaporan">
      <option>Program</option>
      <option>Aktiviti</option>
      <option>PLC</option>
    </select>

    <label class="mt">Nama Program / Aktiviti / PLC</label>
    <input type="text" id="namaLaporan" placeholder="Nama Program / Aktiviti / PLC">
  </div>

  <!-- PILIHAN TAHAP -->
  <div class="card">
    <label>Pilihan Tahap</label>
    <select id="pilihanTahap">
      <option>Peringkat</option>
      <option>Perjumpaan</option>
    </select>

    <label class="mt">Tahap</label>
    <input type="text" id="tahapText">
  </div>

  <!-- TARIKH & LOKASI -->
  <div class="card grid-2">
    <div>
      <label>Tarikh & Masa</label>
      <input type="text" id="tarikhMasa">
    </div>
    <div>
      <label>Tempat / Lokasi</label>
      <input type="text" id="tempatLokasi">
    </div>
  </div>

  <!-- KEHADIRAN -->
  <div class="card">
    <label>Jenis Kehadiran</label>
    <select id="jenisKehadiran">
      <option>Peserta</option>
      <option>Kumpulan Sasaran</option>
      <option>Kehadiran</option>
    </select>

    <label class="mt">Jumlah Kehadiran</label>
    <input type="text" id="jumlahKehadiran">
  </div>

  <!-- GURU -->
  <div class="card">
    <label>Pilihan Guru</label>
    <select id="pilihanGuru">
      <option>Guru Penasihat</option>
      <option>Guru Pengiring</option>
      <option>Guru Penyelaras</option>
    </select>

    <label class="mt">Nama Guru</label>
    <textarea id="namaGuru" rows="3"></textarea>
  </div>

  <!-- LAPORAN -->
  <div class="card">
    <label>Laporan</label>
    <textarea id="laporan" rows="4"></textarea>
  </div>

  <div class="card">
    <label>Kekuatan</label>
    <textarea id="kekuatan" rows="3"></textarea>
  </div>

  <div class="card">
    <label>Kelemahan</label>
    <textarea id="kelemahan" rows="3"></textarea>
  </div>

  <div class="card">
    <label>Penambahbaikan</label>
    <textarea id="penambahbaikan" rows="3"></textarea>
  </div>

  <!-- AUTHOR -->
  <div class="card">
    <label>Disediakan Oleh</label>
    <input type="text" id="disediakanOleh">
  </div>

  <!-- IMAGE UPLOAD -->
  <div class="card">
    <label>Lampiran Gambar (Max 4)</label>
    <input type="file" id="imageInput" accept="image/*" multiple>
    <div id="imagePreview" class="preview-grid"></div>
  </div>

  <!-- ACTION -->
  <div class="actions">
    <button id="generateBtn">Jana PDF</button>
  </div>

</div>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="script.js"></script>
</body>
</html>
